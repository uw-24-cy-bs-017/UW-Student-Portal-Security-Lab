name: security-scan

on: [push]

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install semgrep
      - run: semgrep scan --config semgrep-rules.yml --exclude instructor --error .
